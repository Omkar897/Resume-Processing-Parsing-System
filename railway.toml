[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = "5000"
FLASK_ENV = "production"
PYTHONUNBUFFERED = "1"

[[services]]
name = "web"
service_type = "web"
protocol = "http"

[[services.ports]]
port = 5000
target_port = 5000

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[[services.tcp_checks]]
interval_seconds = 15
timeout_seconds = 5
grace_period_seconds = 5
restart_limit = 5
