<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Results - AI Resume Matcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="results-header">
            <h1>🎉 Your Matched Jobs</h1>
            <div id="resumeInfo" class="resume-info"></div>
        </header>

        <!-- NEW: Email Section -->
        <div class="email-section">
            <div class="email-box">
                <h3>📧 Email Me These Jobs</h3>
                <p>Get this list delivered to your inbox</p>
                <div class="email-form">
                    <input 
                        type="email" 
                        id="emailInput" 
                        placeholder="your.email@example.com"
                        class="email-input"
                    >
                    <button id="sendEmailBtn" class="btn-email">
                        Send to Email
                    </button>
                </div>
                <div id="emailStatus" class="email-status"></div>
            </div>
        </div>

        <div id="jobsContainer" class="jobs-container">
            <!-- Jobs will be inserted here by JavaScript -->
        </div>

        <div class="actions">
            <button class="btn-secondary" onclick="window.location.href='/'">
                Upload Another Resume
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
