services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-scrapper-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      FLASK_DEBUG: "0"
      RESUME_PROJECT_ROOT: "/app"
      HF_HOME: "/app/data/.embedding_cache"
      HF_HUB_CACHE: "/app/data/.embedding_cache/hub"
      RESUME_HEADLESS: "1"
      USE_FIREWORKS_LLM: "1"
      USE_LLM_QUERY_EXPANSION: "1"
      USE_LLM_RERANK: "1"
    volumes:
      - ./data/chromadb:/app/data/chromadb
      - ./data/.embedding_cache:/app/data/.embedding_cache
      - ./web/static/uploads:/app/web/static/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
